name: E2E testing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e2e-pages
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: dev
    outputs:
      pages: ${{ steps.pages.outcome }}
      artifact: github-pages-${{ github.run_attempt }}

    steps:
      - name: Permisos del workspace
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            --entrypoint bash \
            mcr.microsoft.com/playwright:v1.64.0-jammy \
            -lc "chown -R $(id -u):$(id -g) /work"

      - name: Checkout
        uses: actions/checkout@v4

      - name: PASS_ADMIN del servidor
        run: grep -q '^PASS_ADMIN=.' /home/api-core/.env

      - name: Pruebas
        id: tests
        run: |
          docker run --rm \
            --network host \
            --entrypoint bash \
            -v "${{ github.workspace }}:/work" \
            -v /home/api-core/.env:/home/api-core/.env:ro \
            -w /work \
            mcr.microsoft.com/playwright:v1.64.0-jammy \
            -lc "npm ci && npx playwright test"

      - name: Devolver permisos
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            --entrypoint bash \
            mcr.microsoft.com/playwright:v1.64.0-jammy \
            -lc "chown -R $(id -u):$(id -g) /work"

      - name: Bases para revisar
        if: always() && hashFiles('test-results/bases-conservadas.txt') != ''
        run: |
          {
            echo "### Bases para revisar"
            echo '```'
            cat test-results/bases-conservadas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte
        id: pages
        if: always() && steps.tests.conclusion != 'skipped' && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: playwright-report

  deploy:
    needs: e2e
    if: always() && needs.e2e.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.e2e.outputs.artifact }}

      - name: Link
        run: |
          echo "### Reporte" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
