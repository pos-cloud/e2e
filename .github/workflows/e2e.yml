name: E2E testing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencias
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: PASS_ADMIN del servidor
        run: grep -q '^PASS_ADMIN=.' /home/api-core/.env

      - name: Pruebas
        run: npm test

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
