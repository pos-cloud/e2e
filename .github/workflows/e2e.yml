name: E2E testing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PASS_ADMIN del servidor
        run: grep -q '^PASS_ADMIN=.' /home/api-core/.env

      - name: Pruebas
        run: |
          docker run --rm \
            --network host \
            --entrypoint bash \
            -v "${{ github.workspace }}:/work" \
            -v /home/api-core/.env:/home/api-core/.env:ro \
            -w /work \
            mcr.microsoft.com/playwright:v1.64.0-jammy \
            -lc "npm ci && npx playwright test"

      - name: Reporte
        if: always() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90
